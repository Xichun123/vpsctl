name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Run tests with race detection
        run: go test -race ./...
      - name: Vet sources
        run: go vet ./...
      - name: Check installer syntax
        run: bash -n scripts/install.sh
      - name: Install Linux integration dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server rsync util-linux
      - name: Test isolated local OpenSSH integration
        if: runner.os == 'Linux'
        run: |
          sudo mkdir -p /run/sshd
          sudo env "PATH=$PATH:/usr/sbin" VPSCTL_INTEGRATION=1 go test -run '^TestSSHIntegration$' -v .
      - name: Build binary
        run: go build -o dist/vpsctl .
      - uses: actions/upload-artifact@v7
        with:
          name: vpsctl-${{ runner.os }}-${{ runner.arch }}
          path: dist/vpsctl
          if-no-files-found: error

  agent-skill:
    name: Agent Skill package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Install skills CLI
        run: npm install --global skills@1.5.15
      - name: Validate discovery and installation
        run: scripts/check-skill-package.sh

name: Bug report
description: Report reproducible incorrect behavior in vpsctl
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove private keys, passwords, tokens, and production infrastructure details before submitting.
  - type: input
    id: version
    attributes:
      label: vpsctl version
      placeholder: vpsctl 0.3.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest safe sequence that reproduces the problem.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Additional context
